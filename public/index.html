<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>WAVR — Music</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/shared.css" />
</head>
<body>
  <!-- Animated aurora background -->
  <div class="bg-aurora" aria-hidden="true">
    <div class="aurora a1"></div>
    <div class="aurora a2"></div>
    <div class="aurora a3"></div>
    <div class="aurora a4"></div>
    <div class="bg-grid"></div>
    <div class="bg-grain"></div>
  </div>

  <!-- Sidebar -->
  <nav class="sidebar" id="sidebar">
    <a href="/" class="brand" data-route="/">
      <span class="brand-mark"></span>
      <span class="brand-name">WAVR</span>
    </a>

    <ul class="nav-list">
      <li><a href="/" data-route="/" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12l9-9 9 9"/><path d="M5 10v10h14V10"/></svg>
        <span>Home</span>
      </a></li>
      <li><a href="/search" data-route="/search" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <span>Search</span>
      </a></li>
      <li><a href="/library" data-route="/library" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h4v16H4zM10 4h4v16h-4zM16 6l4 1-3 14-4-1z"/></svg>
        <span>Library</span>
      </a></li>
      <li><a href="/downloads" data-route="/downloads" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7,10 12,15 17,10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        <span>Downloads</span>
      </a></li>
      <li><a href="/shazam" data-route="/shazam" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3a3 3 0 00-3 3v6a3 3 0 006 0V6a3 3 0 00-3-3z"/><path d="M19 11v1a7 7 0 01-14 0v-1"/><line x1="12" y1="19" x2="12" y2="22"/></svg>
        <span>Shazam</span>
      </a></li>
    </ul>

    <button class="theme-toggle" id="themeToggle">
      <svg class="ic-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
      <svg class="ic-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
      <span class="theme-label"></span>
    </button>
  </nav>

  <!-- Mobile top bar -->
  <header class="topbar">
    <a href="/" class="brand" data-route="/"><span class="brand-mark"></span><span class="brand-name">WAVR</span></a>
    <button class="theme-toggle compact" id="themeToggleMobile">
      <svg class="ic-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/></svg>
      <svg class="ic-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
    </button>
  </header>

  <main class="app-main" id="appMain">
    <!-- Per-page content + its own CSS/JS get loaded here -->
  </main>

  <!-- Persistent mini player (hidden on /player) -->
  <div class="mini-player" id="miniPlayer" hidden>
    <div class="mini-thumb" id="miniThumb">
      <img id="miniThumbImg" alt="" />
      <div class="mini-fallback" id="miniFallback">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
      </div>
    </div>
    <div class="mini-info">
      <div class="mini-title" id="miniTitle">—</div>
      <div class="mini-artist" id="miniArtist">Nothing playing</div>
    </div>
    <div class="mini-controls">
      <button class="mp-btn" id="mpPrev" title="Previous">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
      </button>
      <button class="mp-btn mp-play" id="mpPlay" title="Play/Pause">
        <svg class="ic-play" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        <svg class="ic-pause" viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
      </button>
      <button class="mp-btn" id="mpNext" title="Next">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6zM16 6h2v12h-2z"/></svg>
      </button>
    </div>
    <div class="mini-progress" id="mpProgress">
      <div class="mini-progress-fill" id="mpProgressFill"></div>
    </div>
  </div>

  <!-- Mobile bottom nav -->
  <nav class="bottom-nav">
    <a href="/" data-route="/" class="bn-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12l9-9 9 9"/><path d="M5 10v10h14V10"/></svg><span>Home</span>
    </a>
    <a href="/search" data-route="/search" class="bn-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><span>Search</span>
    </a>
    <a href="/library" data-route="/library" class="bn-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h4v16H4zM10 4h4v16h-4zM16 6l4 1-3 14-4-1z"/></svg><span>Library</span>
    </a>
    <a href="/downloads" data-route="/downloads" class="bn-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7,10 12,15 17,10"/></svg><span>Downloads</span>
    </a>
    <a href="/shazam" data-route="/shazam" class="bn-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3a3 3 0 00-3 3v6a3 3 0 006 0V6a3 3 0 00-3-3z"/><path d="M19 11v1a7 7 0 01-14 0v-1"/></svg><span>Shazam</span>
    </a>
  </nav>

  <!-- Persistent media -->
  <audio id="audioEl" preload="metadata"></audio>
  <video id="videoEl" preload="metadata" playsinline></video>

  <div id="toastStack" class="toast-stack"></div>

  <script src="/js/shared.js"></script>
</body>
</html>
